repositories {
    mavenCentral()
    maven { url 'https://repo.dairy.foundation/releases/'} // Sloth (used by the vendored AutoTune framework)
    google() // Needed for androidx
}

dependencies {
    implementation 'org.firstinspires.ftc:Inspection:11.2.1'
    implementation 'org.firstinspires.ftc:Blocks:11.2.1'
    //noinspection Aligned16KB
    implementation 'org.firstinspires.ftc:RobotCore:11.2.1'
    implementation 'org.firstinspires.ftc:RobotServer:11.2.1'
    implementation 'org.firstinspires.ftc:OnBotJava:11.2.1'
    implementation 'org.firstinspires.ftc:Hardware:11.2.1'
    implementation 'org.firstinspires.ftc:FtcCommon:11.2.1'
    implementation 'org.firstinspires.ftc:Vision:11.2.1'
    implementation 'androidx.appcompat:appcompat:1.2.0'

    // Safe Pedro Pathing (Synapse-safe fork of Pedro Pathing).
    // Pulls in :core transitively. Synapse is declared explicitly because
    // team code imports its SafeOpMode / SafeHardwareMap classes directly.
    implementation 'com.aaravlabs.safepedropathing:revhub:0.1.4'
    implementation 'com.aaravlabs:synapse:0.4.0'

    // Vendored AutoTune framework dependencies (see .../pedro/tuning/).
    implementation 'dev.frozenmilk.sinister:Sloth:0.3.0'
    implementation 'com.aventrix.jnanoid:jnanoid:2.0.0'
    implementation('org.nanohttpd:nanohttpd-websocket:2.3.1') {
        exclude module: 'nanohttpd' // NanoHTTPD core is already shaded into RobotCore
    }
}
